

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="receptionist.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar"><Ri:a></Ri:a>

        <div class="logo">
            <img src="109126.jpg" alt="VMS Logo">
            
        </div>

        <ul>

            <li class="active">
                <a href="receptionist.html"><i class="fa-solid fa-house"></i> Dashboard</a>
            </li>

            <li>
                <a href="Registration.html"><i class="fa-solid fa-user-plus"></i> Register Visitor</a>
            </li>

            <li>
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search Visitor</a>
            </li>

            <li>
                <a href="#"><i class="fa-solid fa-list-check"></i> Manage Appointments</a>
            </li>

            <li>
                <a href="#"><i class="fa-solid fa-right-to-bracket"></i> Check-In</a>
            </li>

            <li>
                <a href="#"><i class="fa-solid fa-right-from-bracket"></i> Check-Out</a>
            </li>

            <li>
                <a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->
    <main class="content">

        <header>

            <h1>Receptionist Dashboard</h1>

            

        </header>

        <!-- Dashboard Cards -->
        <section class="cards">

            <div class="card">
                <h3>Total Visitors</h3>
            
            </div>

            <div class="card">
                <h3>Pending Appointments</h3>
                
            </div>

            <div class="card">
                <h3>Checked In</h3>
                
            </div>

            <div class="card">
                <h3>Checked Out</h3>
                
            </div>

        </section>

        <!-- Recent Activity -->
        <section class="table-section">

            <h2>Recent Visitor Activity</h2>

            <table>

                <thead>
                    <tr>
                        <th>Visitor</th>
                        <th>Host</th>
                        <th>Status</th>
                        <th>Time</th>
                    </tr>
                </thead>


            </table>

        </section>

    </main>

</div>

</body>
</html>
