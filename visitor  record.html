<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Records</title>

    <link rel="stylesheet" href="../css/visitor-records.css">
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <img src="../images/109126.jpg" alt="VMS Logo">
        </div>

        <ul>
            <li>
                <a href="admin.html">Dashboard</a>
            </li>

            <li>
                <a href="#">Manage Users</a>
            </li>

            <li>
                <a href="#">Manage Departments</a>
            </li>

            <li class="active">
                <a href="visitor-records.html">Visitor Records</a>
            </li>

            <li>
                <a href="#">Appointment Records</a>
            </li>

            <li>
                <a href="#">Reports</a>
            </li>

            <li>
                <a href="#">Settings</a>
            </li>

            <li>
                <a href="../index.html">Logout</a>
            </li>
        </ul>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="content">

        <header>
            <h1>Visitor Records</h1>
            <p>View and manage registered visitors.</p>
        </header>


        <!-- SEARCH -->
        <div class="search-box">
            <input
                type="text"
                id="visitorSearch"
                placeholder="Search visitor by name or phone..."
            >

            <button id="searchBtn">
                Search
            </button>
        </div>


        <!-- VISITOR TABLE -->
        <section class="table-section">

            <h2>Registered Visitors</h2>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Gender</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="visitorTableBody">
                    <!-- JavaScript will add visitors here -->
                </tbody>

            </table>

            <p id="noVisitors">
                No visitors found.
            </p>

        </section>

    </main>

</div>

<script src="../java script/visitor-records.js"></script>

</body>
</html>
