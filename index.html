<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VMS Login</title>

    <link rel="stylesheet" href="index.css">
   

</head>

<body>

<div class="container">

    <!-- Left Section -->
    <div class="left">

        <h1>Visitor Management System</h1>

        <img src="../VMS/images/109126.jpg" alt="VMS Logo">
    
        </div>


    <!-- Right Section -->
    <div class="right">

        <div class="login-box">

            <h2>Login Your Information</h2>


            <form id="loginForm">

                <label>Username</label>

                <input 
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required
                >


                <label>Password</label>

                <input 
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >


                <button type="submit">
                    Login
                </button>


                <p id="loginMessage"></p>

            </form>

        </div>

    </div>

</div>


<!-- JavaScript -->

 <script src="index.js"></script>
</body>

</html>
