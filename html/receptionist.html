<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receptionist Dashboard</title>

    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    
    <link rel="stylesheet" href="../css/receptionist.css">
</head>

<body>

    <!-- sidebar -->
     <a=        <div class="logo">==
        =
            <h2>VMS</h2>
        </div>

        <nav class="sidebar-nav">

            <!-- Dashboard -->
            <a href="receptionist.html" class="nav-btn active">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>


            <!-- Search Visitor -->
            <a href="search.html" class="nav-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search Visitor</span>
            </a>


            <!-- Manage Appointments -->
            <a href="manage appointment.html" class="nav-btn">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Manage Appointments</span>
            </a>

        </nav>


        <!-- Logout -->
        <button class="logout-btn" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </button>

    </aside>


    <!--main content -->

    <main class="main-content">

        <h1>Receptionist Dashboard</h1>


        <!-- cards-->

        <div class="stats-container">

            <!-- Total Visitors -->
            <div class="stat-card">

                <div>
                    <h3>Total Visitors</h3>
                    <p id="totalVisitors">0</p>
                </div>

            

            </div>


            <!-- Pending Appointments -->
            <div class="stat-card">

                <div>
                    <h3>Pending Appointments</h3>
                    <p id="pendingAppointments">0</p>
                </div>

            </div>


            <!-- Checked In -->
            <div class="stat-card">

                <div>
                    <h3>Checked In</h3>
                    <p id="checkedIn">0</p>
                </div>

            </div>


            <!-- Checked Out -->
            <div class="stat-card">

                <div>
                    <h3>Checked Out</h3>
                    <p id="checkedOut">0</p>
                </div>

            </div>

        </div>


        <!--  weekly activities  -->

        <section class="activities">

            <h2>Weekly Activities</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Visitor</th>
                            <th>Host</th>
                            <th>Status</th>
                            <th>Time</th>
                            <th>Date</th>
                        </tr>

                    </thead>

                    <tbody id="activityTable">

                        <tr>
                            <td colspan="4">
                                No activities available
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="../JavaScript/receptionist.js"></script>

</body>
</html>
