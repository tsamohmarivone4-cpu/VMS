<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receptionist Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../css/receptionist.css">
</head>

<body>



<!-- sidebar -->
<aside class="sidebar">

    <div class="logo">
       <img src="../images/IMG_E6766.JPG" alt="vms logo" width="200px" height="150px">
    </div>

    <nav class="sidebar-nav">

        <div class="nav-btn active"
             onclick="loadPage()">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </div>

        <div class="nav-btn"
             onclick="loadPage('search.html', this)">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search Visitor</span>
        </div>

        <div class="nav-btn"
             onclick="loadPage('manage appointment.html', this)">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Manage Appointments</span>
        </div>

    </nav>

    <button class="logout-btn" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
    </button>

</aside>

    <!-- main content-->

    <main class="main-content">
        <div id="pageContent">

        

         <h1>Receptionist Dashboard</h1>


        <!-- cards-->

        <div class="stats-container">

            <div class="stat-card">
                <div>
                    <h3>Total Visitors</h3>
                    <p id="totalVisitors">0</p>
                </div>

                <i class="fa-solid fa-users"></i>
            </div>


            <div class="stat-card">
                <div>
                    <h3>Pending Appointments</h3>
                    <p id="pendingAppointments">0</p>
                </div>

                <i class="fa-solid fa-calendar-days"></i>
            </div>


            <div class="stat-card">
                <div>
                    <h3>Checked In</h3>
                    <p id="checkedIn">0</p>
                </div>

                <i class="fa-solid fa-right-to-bracket"></i>
            </div>


            <div class="stat-card">
                <div>
                    <h3>Checked Out</h3>
                    <p id="checkedOut">0</p>
                </div>

                <i class="fa-solid fa-right-from-bracket"></i>
            </div>

        </div>


        <!-- weekly activities-->

        <section class="activities">

            <h2>Weekly Activities</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Visitor</th>
                            <th>Host</th>
                            <th>Status</th>
                            <th>Time</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="activityTable">

                        <tr>
                            <td colspan="5">
                                No activities available
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>
        </div>
    </main>


    <script src="../java script/receptionist.js"></script>
    <script src="../java script/receptionist.js"></script>
    <script src="../java script/search.js"></script>
    <script src="../java script/registration.js"></script>
    <script src="../java script/booking.js"></script>
    <script src="../java script/manage appointment.js"></script>


</body>
</html>
