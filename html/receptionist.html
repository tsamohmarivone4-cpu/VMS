<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receptionist Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../css/receptionist.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            <h2>VMS</h2>
        </div>

        <nav class="sidebar-nav">

            <a href="receptionist.html" class="nav-btn active">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="search.html" class="nav-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search Visitor</span>
            </a>

            <a href="manage appointment.html" class="nav-btn">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Manage Appointments</span>
            </a>

        </nav>

        <button class="logout-btn" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </button>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <h1>Receptionist Dashboard</h1>


        <!-- ================= STATISTICS ================= -->

        <div class="stats-container">

            <div class="stat-card">
                <div>
                    <h3>Total Visitors</h3>
                    <p id="totalVisitors">0</p>
                </div>

                <i class="fa-solid fa-users"></i>
            </div>


            <div class="stat-card">
                <div>
                    <h3>Pending Appointments</h3>
                    <p id="pendingAppointments">0</p>
                </div>

                <i class="fa-solid fa-calendar-days"></i>
            </div>


            <div class="stat-card">
                <div>
                    <h3>Checked In</h3>
                    <p id="checkedIn">0</p>
                </div>

                <i class="fa-solid fa-right-to-bracket"></i>
            </div>


            <div class="stat-card">
                <div>
                    <h3>Checked Out</h3>
                    <p id="checkedOut">0</p>
                </div>

                <i class="fa-solid fa-right-from-bracket"></i>
            </div>

        </div>


        <!-- ================= WEEKLY ACTIVITIES ================= -->

        <section class="activities">

            <h2>Weekly Activities</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Visitor</th>
                            <th>Host</th>
                            <th>Status</th>
                            <th>Time</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="activityTable">

                        <tr>
                            <td colspan="5">
                                No activities available
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="../JavaScript/receptionist.js"></script>

</body>
</html>
