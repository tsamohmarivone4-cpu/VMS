<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Host Dashboard</title>

    <link rel="stylesheet" href="../css/Host.css">
</head>

<body>

<div class="dashboard">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

        <div class="logo">
            <img
                src="../images/IMG_E6766.JPG"
                alt="VMS Logo"
            >
        </div>

        <nav>

            <button onclick="showSection('all')">
                Dashboard
            </button>

            <button onclick="showSection('pending')">
                Pending Appointments
            </button>

            <button onclick="showSection('approved')">
                Approved Appointments
            </button>

            <button onclick="showSection('rescheduled')">
                Rescheduled Appointments
            </button>

            <button onclick="showSection('current')">
                Current Visitors
            </button>

            <button onclick="showSection('completed')">
                Completed Visits
            </button>

        </nav>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->
    <main class="main">

        <!-- HEADER -->
        <header class="topbar">

            <div>
                <h1>Host Dashboard</h1>

                <p>
                    View and manage your visitor appointments.
                </p>
            </div>

        </header>


        <!-- ================= CARDS ================= -->
        <section class="cards">

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingCount">0</p>
            </div>

            <div class="card">
                <h3>Approved</h3>
                <p id="approvedCount">0</p>
            </div>

            <div class="card">
                <h3>Current Visitors</h3>
                <p id="currentCount">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedCount">0</p>
            </div>

        </section>


        <!-- ================= APPOINTMENT TABLE ================= -->

        <section class="appointment-section">

            <div class="section-header">

                <h2 id="tableTitle">
                    All Appointments
                </h2>

            </div>


            <div class="table-container">

                <table class="appointment-table">

                    <thead>

                        <tr>

                            <th>Visitor</th>

                            <th>Purpose</th>

                            <th>Date</th>

                            <th>Time</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="appointmentTableBody">

                        <!-- JavaScript loads appointments here -->

                    </tbody>

                </table>

            </div>


            <p
                id="noAppointments"
                class="no-appointments"
            >
                No appointments found.
            </p>

        </section>

    </main>

</div>


<script src="../java script/host.js"></script>

</body>

</html>
