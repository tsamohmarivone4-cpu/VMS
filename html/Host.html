<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Dashboard</title>
    <link rel="stylesheet" href="../css/Host.css">
</head>
<body>
    <header>
    <h2><img src="../images/109126.jpg" alt="Visitor Logo" width="150" height="150">Host Dashboard</h2>
</header>

<div class="container">
   <div class="welcome-card">
    <h2>Review Appointments</h2>
    <p>Approve or reject visitor appointments scheduled with you.</p>
   </div> 

   <div class="tabs">
            <!-- Tabs -->
<button id="tabAll" class="tab active">All</button>
<button id="tabPending" class="tab">Pending</button>
<button id="tabToday" class="tab">Today</button>

<!-- Table Body -->
<table>
  <thead>
    <tr>
      <th>Visitor</th><th>Purpose</th><th>Status</th><th>Action</th>
    </tr>
  </thead>
  <tbody id="appointmentsTable">
    <!-- JS will fill this -->
  </tbody>
</table>

<button onclick="logout()">Logout</button>

</div>
<script src="../java script/host.js"></script>
</body>
</html>
