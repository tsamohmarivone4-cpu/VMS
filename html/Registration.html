<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Registration</title>

    <link rel="stylesheet" href="../css/Reg.css">
</head>

<body>

    <div class="main-container">

    


        <!-- RIGHT SIDE -->
        <div class="right-side">

            <form id="VisitorForm">

                <h2>Visitor Registration Form</h2>

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    required
                >


                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    required
                >


                <label for="gender">
                    Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                    required
                >
                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>
                </select>


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <div class="buttons">

                    <button type="submit">
                        Register Visitor
                    </button>

                    <button type="reset">
                        Clear
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../java script/registration.js"></script>

</body>

</html>
