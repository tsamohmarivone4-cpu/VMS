<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Registration</title>

    <link rel="stylesheet" href="../css/Reg.css">
</head>

<body>

    <div class="right-side">

        <form id="VisitorForm">

            <h2>Visitor Registration Form</h2>

            <label>Full Name</label>
            <input type="text" name="fullname" required>


            <label>Phone Number</label>
            <input type="text" name="phone" required>


            <label>Gender</label>
            <select name="gender" required>

                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>


            </select>


            <label>Email Address</label>
            <input type="email" name="email">


            <div class="buttons">

                <button type="submit">
                    Register Visitor
                </button>

                <button type="reset">
                    Clear
                </button>

            </div>

        </form>

    </div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const form =
                document.getElementById("VisitorForm");


            form.addEventListener("submit", function (event) {

                event.preventDefault();


                /* GET INFORMATION */

                const fullName =
                    document.querySelector(
                        'input[name="fullname"]'
                    ).value.trim();


                const phone =
                    document.querySelector(
                        'input[name="phone"]'
                    ).value.trim();


                const gender =
                    document.querySelector(
                        'select[name="gender"]'
                    ).value;


                const email =
                    document.querySelector(
                        'input[name="email"]'
                    ).value.trim();


                /* GET EXISTING VISITORS */

                let visitors =
                    JSON.parse(
                        localStorage.getItem("vmsVisitors")
                    ) || [];


                /* CREATE VISITOR */

                const newVisitor = {

                    id: Date.now(),

                    fullName: fullName,

                    phone: phone,

                    gender: gender,

                    email: email,

                    date:
                        new Date()
                            .toISOString()
                            .split("T")[0]

                };


                /* SAVE VISITOR */

                visitors.push(newVisitor);

                localStorage.setItem(
                    "vmsVisitors",
                    JSON.stringify(visitors)
                );


                /* SAVE CURRENT VISITOR */

                localStorage.setItem(
                    "appointmentVisitor",
                    JSON.stringify(newVisitor)
                );


                /*
                   ASK WHAT THE VISITOR NEEDS
                */

                const needsAppointment =
                    confirm(
                        "Does this visitor need an appointment?"
                    );


                if (needsAppointment) {

                    /*
                       GO TO APPOINTMENT BOOKING
                    */

                    window.location.href =
                        "appointment booking.html";

                } else {

                    /*
                       VISITOR DOES NOT NEED
                       AN APPOINTMENT.

                       CHECK THEM IN.
                    */

                    let visits =
                        JSON.parse(
                            localStorage.getItem("vmsVisits")
                        ) || [];


                    const today =
                        new Date()
                            .toISOString()
                            .split("T")[0];


                    visits.push({

                        visitorId: newVisitor.id,

                        visitorName:
                            newVisitor.fullName,

                        host: "Reception",

                        date: today,

                        checkInTime:
                            new Date()
                                .toLocaleTimeString(),

                        checkOutTime: "",

                        status: "Checked In"

                    });


                    localStorage.setItem(
                        "vmsVisits",
                        JSON.stringify(visits)
                    );


                    alert(
                        "Visitor registered and checked in successfully."
                    );


                    /*
                       RETURN TO SEARCH PAGE
                    */

                    window.location.href =
                        "search.html";

                }

            });

        });

    </script>

</body>

</html>
