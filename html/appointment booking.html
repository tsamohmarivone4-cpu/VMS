<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointment Booking Form</title>

    <link rel="stylesheet" href="../css/Booking.Css">
</head>

<body>

<div class="appointment-form">



    <!-- righ side -->
    <div class="form">

        <h1>Schedule an Appointment</h1>

        <!-- visitors information-->
        <div id="visitorInfo">
            <p>
                Visitor:
                <strong id="visitorName">Loading...</strong>
            </p>
        </div>


        <form id="appointmentForm">

            <!-- HOST -->
            <label for="host">Host Name</label>

            <select id="host" required>

                <option value="">
                    Select Host
                </option>

            </select>


            <!--purpose--> 
            <label for="purpose">
                Purpose of Visit
            </label>

            <textarea
                id="purpose"
                placeholder="Enter the purpose of your visit"
                rows="4"
                required
            ></textarea>


            <!-- date -->
            <label for="appointmentDate">
                Date
            </label>

            <input
                type="date"
                id="appointmentDate"
                required
            >


            <!-- time -->
            <label for="appointmentTime">
                Time
            </label>

            <input
                type="time"
                id="appointmentTime"
                required>
            

            <!-- buttons-->
            <div class="buttons">

                <button type="button" id="cancel">
                    Cancel
                </button>

                <button type="submit" id="submit">
                    Submit Booking
                </button>

            </div>

        </form>


        <p id="message"></p>

    </div>

</div>


<script src="../java script/booking.js"></script>

</body>
</html>
