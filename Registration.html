<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Registration</title>
    <link rel="stylesheet" href="Reg.css">
</head>
<body>
 <h3>Visitor Registration Form</h3>
 <form>

    <label>Full Name:</label><br>
    <input type="text" name="fullname"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="phone"><br><br>

    <label>Email Address:<a/label><br>
    <input type="email" name="email"><br><br>

    <label>ID card Number</label><br>
    <input type="text" name="idcard"><br><br>

    <label>Person to Visit</label><br>
    <input type="text" name="Person"><br><br>

    <label>Department:</label><br>
    <input type="text" name="department"><br><br>

    <label>Purpose of visit:</label><br>
    <textarea rows="4" cols="30"></textarea><br><br>

    <label>Date of Visit:</label><br>
    <input type="date"><br><br>

    <Label>Time In:</Label><br>
    <input type="time"><br><br>

    <input type="submit" Value="Register">
    <input type="reset" Value="Reset">
 </form>   
</body>
</html>
